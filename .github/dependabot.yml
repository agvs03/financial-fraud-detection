# Automated dependency updates. Dependabot opens a PR when a dependency has a
# newer version; CI runs on the PR, and you merge if it's green. Keeps the
# Python stack (TensorFlow, scikit-learn, FastAPI, …) and the GitHub Actions
# current without manual tracking.
#
# `groups` collapses all updates in each ecosystem into a SINGLE PR per week,
# instead of one PR per package — far less noise on a solo repo.
version: 2
updates:
  # Python packages in requirements.txt — one grouped PR per week
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    groups:
      python:
        patterns:
          - "*"

  # Versions of the actions used inside .github/workflows/*.yml — one grouped PR
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
    groups:
      actions:
        patterns:
          - "*"
