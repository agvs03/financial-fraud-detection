name: Pipeline

# Exercises the full training pipeline end-to-end on every push. The real
# Kaggle dataset is gated and ~144 MB, so CI runs on a schema-compatible
# synthetic sample generated by scripts/make_sample_data.py. The metric check
# below is a SMOKE test (does the pipeline run and beat chance?), not a quality
# claim — real metrics come from training on the actual dataset.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  train-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate synthetic dataset
        run: python scripts/make_sample_data.py --rows 20000 --out data/creditcard.csv

      - name: Train full pipeline (ANN + baselines)
        run: python -m src.train

      - name: Smoke-check pipeline output
        run: |
          python - <<'PY'
          import json
          data = json.load(open("reports/metrics.json"))
          models = data["models"]
          assert len(models) == 4, f"expected 4 models, got {len(models)}"
          best = max(m["roc_auc"] for m in models)
          print("models trained:", [m["name"] for m in models])
          print(f"best ROC-AUC on synthetic data = {best:.4f}")
          # Loose sanity floor: the synthetic generator injects real signal, so a
          # working pipeline should comfortably beat chance. Not a real metric gate.
          assert best >= 0.6, "pipeline smoke check failed: models no better than chance"
          print("Pipeline smoke check passed.")
          PY

      - name: Upload trained artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fraud-model-and-figures
          path: |
            models/
            reports/
          retention-days: 14
