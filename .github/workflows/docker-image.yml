name: Docker Image CI

on:
  push:
    branches: [ "main" ]
    paths-ignore: [ "**.md", "LICENSE", "docs/**", ".gitignore" ]
  pull_request:
    branches: [ "main" ]
    paths-ignore: [ "**.md", "LICENSE", "docs/**", ".gitignore" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag my-image-name:$(date +%s)
